publishing {
	publications {
		"mavenJava${project.name}"(MavenPublication) {
			// Use project.provider to make it configuration-cache safe
			def projectGroup = projects.sparkweaveCommon.group
			def projectName = projects.sparkweaveCommon.name
			pom.withXml {
				def dependenciesNode = asNode().get("dependencies")
				if (dependenciesNode.isEmpty()) {
					dependenciesNode = asNode().appendNode('dependencies')
				} else {
					dependenciesNode = dependenciesNode.get(0)
				}

				def dependencyNode = dependenciesNode.dependency.find { node ->
					node.groupId.text() == projectGroup && node.artifactId.text() == projectName
				}
				if (dependencyNode == null) {
					dependencyNode = dependenciesNode.appendNode('dependency')
					dependencyNode.appendNode('groupId', projectGroup)
					dependencyNode.appendNode('artifactId', projectName)
					dependencyNode.appendNode('classifier', 'renderdoc')
				}
				dependencyNode.appendNode('classifier', 'renderdoc')
			}
		}
	}
}

